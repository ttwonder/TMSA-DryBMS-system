name: Build and deploy compliance platform
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      # Fixed tool/dependency values only; no event text is executed.
      - name: Prepare Python PDF test runtime
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: false
      - name: Prepare offline PDF test dependencies
        run: |
          uv python install 3.12
          uv run --with pymupdf==1.26.5 python -c "import pymupdf"
          uv run --with pymupdf==1.26.5 --with fonttools==4.60.1 --with openpyxl==3.1.5 python -c "import pymupdf, fontTools, openpyxl"
          uv run --offline --with pymupdf==1.26.5 python -c "import pymupdf"
          uv run --offline --with pymupdf==1.26.5 --with fonttools==4.60.1 --with openpyxl==3.1.5 python -c "import pymupdf, fontTools, openpyxl"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: node scripts/verify-public-artifacts.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
